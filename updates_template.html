<!DOCTYPE html>
<!-- 這一頁是 build.py 從 updates.json 產生的，不要直接改 updates.html。
     celine：「更新紀錄不要是收合，是點進去看到新網頁」。 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>更新紀錄 — 壽星日 Birthday Deals</title>
<meta name="description" content="壽星日 Birthday Deals 的更新紀錄：每次改了什麼，都按日期記在這裡。">
<link rel="canonical" href="https://birthdaydeals.celine-fu-work.workers.dev/updates.html">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#f6f6f8; --surface:#fff; --line:#ececf1; --line-soft:#f4f4f7;
    --ink:#18181f; --ink-2:#6b6b76; --ink-3:#a1a1ab;
    --accent:#e8483c; --accent-dark:#c8352b; --accent-soft:#fdecea; --accent-line:#f8c9c4;
    --r:12px;
    --shadow-sm:0 1px 3px rgba(20,20,35,.06);
    --f: ui-sans-serif,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);
    font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-underline-offset:3px}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px}
  header{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 0}
  header .wrap{display:flex;align-items:center;gap:10px}
  .logo{font-weight:800;font-size:1.05rem;color:var(--ink);text-decoration:none}
  .back{margin-left:auto;font-size:.85rem}
  main{padding:28px 0 56px}
  h1{font-size:1.5rem;margin:0 0 6px;line-height:1.35}
  .lead{color:var(--ink-2);font-size:.92rem;margin:0 0 24px}
  /* 一筆一張卡：日期在上面當小標，標題粗體，下面是這次改了什麼。
     不用時間軸的線條跟圓點——在手機上那條線永遠跟文字搶左邊的空間。 */
  .u{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 18px;margin:0 0 10px;box-shadow:var(--shadow-sm)}
  .u-date{font-size:.74rem;color:var(--ink-3);font-variant-numeric:tabular-nums;
    letter-spacing:.02em}
  .u h2{font-size:1rem;margin:2px 0 0;line-height:1.45}
  .u ul{margin:8px 0 0;padding-left:1.15em;font-size:.88rem;color:var(--ink-2)}
  .u li{margin:4px 0}
  .u:first-of-type{border-color:var(--accent-line);background:var(--accent-soft)}
  .u:first-of-type ul{color:var(--ink-2)}
  footer{border-top:1px solid var(--line);padding:22px 0 44px;font-size:.8rem;color:var(--ink-3)}
  footer p{margin:5px 0}
  @media (max-width:520px){
    h1{font-size:1.3rem}
    .u{padding:13px 15px}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="./">壽星日 Birthday Deals</a>
    <a class="back" href="./">← 回首頁</a>
  </div>
</header>

<main class="wrap">
  <h1>更新紀錄</h1>
  <p class="lead">壽星日每次改了什麼，都記在這裡。由新到舊。</p>
<!--__UPDATES_BODY__-->
</main>

<footer class="wrap">
  <p><a href="./">← 回壽星日首頁</a>　·　<a href="about.html">關於做這個網站的人</a>　·　<a href="privacy.html">隱私權政策</a></p>
  <p>© <span id="y">2026</span> 壽星日 Birthday Deals. All rights reserved.</p>
</footer>
<script>document.getElementById('y').textContent=new Date().getFullYear();</script>

<!-- 這一頁被打開幾次、有沒有人從這裡點進品牌頁（審核頁的「咖啡按鈕與站外連結」看得到）。
     見 track.js：不載 Supabase 的 JS 函式庫，直接 POST 一筆；失敗就算了，不擋頁面。 -->
<script src="config.js"></script>
<script src="track.js" data-page="updates"></script>

</body>
</html>
